<style>body{overflow:hidden}.palco{position:relative;height:100svh;overflow:hidden}.slide{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:clamp(56px,9vh,96px) 0 112px;visibility:hidden;opacity:0;transform:translateX(3%);transition:opacity .55s var(--able-page),transform .6s var(--able-page),visibility 0s linear .6s}.slide.antes{transform:translateX(-3%)}.slide.ativo{visibility:visible;opacity:1;transform:none;transition:opacity .55s var(--able-page),transform .6s var(--able-page),visibility 0s}.slide [data-item]{opacity:0;transform:translateY(18px);transition:opacity .6s var(--able-enter),transform .6s var(--able-enter)}.slide.ativo [data-item]{opacity:1;transform:none}.slide.ativo .o1{transition-delay:.15s}.slide.ativo .o2{transition-delay:.27s}.slide.ativo .o3{transition-delay:.39s}.slide.ativo .o4{transition-delay:.51s}@media(prefers-reduced-motion:reduce){.slide,.slide [data-item]{transition:none}}.wrap{max-width:var(--largura-max);margin:0 auto;padding:0 var(--margem);width:100%;box-sizing:border-box}h2{font-size:clamp(40px,5vw,56px);line-height:1.15;letter-spacing:-.02em;font-weight:600;text-wrap:balance;max-width:22ch;margin:0}.lede{margin:20px 0 0;max-width:62ch;color:var(--cor-texto-secundario)}.lede strong{color:var(--cor-tinta);font-weight:500}.campo{border:1px dashed var(--cor-borda-controle);border-radius:14px}.campo:focus-within{border-color:var(--cor-texto-secundario)}.campo-rotulo{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--cor-texto-secundario)}.campo-rotulo::before{content:"";width:20px;height:3px;background:var(--cor-tangelo);flex:none}.campo-bloco{padding:22px 24px}.campo-texto{outline:none;margin-top:10px;min-height:1.5em}.campo-texto:empty::before,.campo-inline:empty::before{content:attr(data-vazio);color:var(--cor-texto-secundario);opacity:.6;white-space:nowrap}header .campo-inline{border-color:var(--cor-grafite-borda)}header .campo-inline:empty::before{color:var(--cor-grafite-texto-secundario);opacity:1}body.apresentando header .campo-inline:empty{display:inline-block}body.apresentando header .campo-inline:empty::before{content:"—";color:var(--cor-grafite-texto-secundario)}.campo-inline{display:inline-block;vertical-align:baseline;border:1px dashed var(--cor-borda-controle);border-radius:8px;padding:0 10px;outline:none;min-width:8ch}.fecho{background:var(--cor-grafite);color:var(--cor-papel)}body.apresentando .campo{border:none}body.apresentando .campo-bloco{padding:0}body.apresentando .campo-inline{border:none;padding:0}body.apresentando .campo-rotulo::before{display:none}body.apresentando .campo-inline:empty,body.apresentando .campo-texto:empty,body.apresentando .modo{display:none}</style></head><body><div id="root"></div>
