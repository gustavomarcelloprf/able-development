<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;padding:96px;display:flex;flex-direction:column;background:var(--cor-papel);color:var(--cor-tinta)}
.slide.grafite{background:var(--cor-grafite);color:var(--cor-papel)}
.topo{display:flex;align-items:center;gap:22px;flex:none}.topo .traco{width:44px;height:4px;background:var(--cor-tangelo);flex:none}
.eyebrow{font-size:29px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--cor-texto-secundario)}.grafite .eyebrow{color:var(--cor-grafite-texto-secundario)}
.miolo{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.rodape{flex:none;display:flex;align-items:center;justify-content:space-between}.rodape img{height:60px;display:block}
.contador{font-size:27px;font-weight:500;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--cor-texto-secundario)}.grafite .contador{color:var(--cor-grafite-texto-secundario)}
.sec{color:var(--cor-texto-secundario)}
</style></head><body><div class="slide"><header class="topo"><span class="traco"></span><span class="eyebrow">Para quem construímos</span></header><main class="miolo"><div style="font-size:140px;font-weight:600;line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums">01</div><div style="width:64px;height:5px;background:var(--cor-tangelo);margin-top:36px"></div><h2 style="font-size:72px;font-weight:600;line-height:1.08;letter-spacing:-.025em;margin-top:56px;max-width:860px;text-wrap:balance">Empresas que precisam de sistemas internos sérios.</h2><p class="sec" style="font-size:40px;line-height:1.4;letter-spacing:-.01em;margin-top:44px;max-width:820px">Jurídico, financeiro, operações. Negócios dispostos a pagar por engenharia de verdade.</p></main><footer class="rodape"><img src="../assets/simbolo.svg" alt=""><span class="contador">2 / 5</span></footer></div></body></html>
