<!-- @dsCard group="Spacing" viewport="700x150" name="Motion · duas curvas" subtitle="ableEnter (entrada) e ablePage (troca de plano). Só transform e opacity. Reduced-motion zera tudo." -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;border:1px solid var(--cor-borda-sutil);border-radius:10px;overflow:hidden;background:var(--cor-papel)}.sw .c{height:56px}.sw .m{padding:8px 10px}.sw .n{font-size:13px;font-weight:500}.sw .x{font-size:11px;color:var(--cor-texto-secundario);font-variant-numeric:tabular-nums}.cap{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--cor-texto-secundario)}.rv{opacity:0;transform:translateY(18px);animation:in .6s var(--able-enter) forwards}.rv:nth-child(2){animation-delay:.12s}.rv:nth-child(3){animation-delay:.24s}@keyframes in{to{opacity:1;transform:none}}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div><div class="rv" style="font-size:22px;font-weight:600;letter-spacing:-.01em">A complexidade entra em cena depois.</div><div class="rv" style="font-size:13px;color:var(--cor-texto-secundario);margin-top:8px">reveal · translateY 18 → 0 + opacity · .6s · cascata .12s</div><div class="rv" style="font-size:13px;color:var(--cor-texto-secundario)">inerte sob prefers-reduced-motion</div></div><div style="font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums"><b style="font-weight:500">ableEnter</b> cubic-bezier(.16, 1, .3, 1)<br><b style="font-weight:500">ablePage</b> cubic-bezier(.65, .05, .18, 1)<br><span style="color:var(--cor-texto-secundario)">valores provisórios em calibração</span></div></div></body></html>
