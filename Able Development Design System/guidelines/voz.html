<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;width:700px;height:190px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;border:1px solid var(--cor-borda-sutil);border-radius:10px;overflow:hidden;background:var(--cor-papel)}.sw .c{height:56px}.sw .m{padding:8px 10px}.sw .n{font-size:13px;font-weight:500}.sw .x{font-size:11px;color:var(--cor-texto-secundario);font-variant-numeric:tabular-nums}.cap{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--cor-texto-secundario)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:15px"><div style="border:1px solid var(--cor-tinta);border-left:3px solid #FB4D00;border-radius:10px;padding:16px 18px"><div class="cap" style="margin-bottom:8px">Assim soamos</div><p style="margin:0;font-style:italic">“O ambiente de homologação fica pronto quarta, às 14h. Se algo mudar, você fica sabendo antes do prazo, não depois.”</p></div><div style="border:1px solid var(--cor-borda-sutil);border-radius:10px;padding:16px 18px"><div class="cap" style="margin-bottom:8px">Assim não soamos</div><p style="margin:0;font-style:italic;color:var(--cor-texto-secundario)">“Estamos superempolgados em compartilhar que em breve teremos novidades incríveis no seu projeto!”</p></div></div></body></html>
