<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;border:1px solid var(--cor-borda-sutil);border-radius:10px;overflow:hidden;background:var(--cor-papel)}.sw .c{height:56px}.sw .m{padding:8px 10px}.sw .n{font-size:13px;font-weight:500}.sw .x{font-size:11px;color:var(--cor-texto-secundario);font-variant-numeric:tabular-nums}.cap{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--cor-texto-secundario)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:12px;color:var(--cor-texto-secundario)"><div style="border:1px solid var(--cor-borda-sutil);border-radius:10px;padding:12px;text-align:center"><img src="../assets/simbolo.svg" style="height:48px"><div style="margin-top:8px;color:var(--cor-tinta);font-weight:500">Silhueta em tinta ✔</div></div><div style="border:1px solid var(--cor-borda-sutil);border-radius:10px;padding:12px;text-align:center;position:relative"><img src="../assets/simbolo.svg" style="height:48px;transform:rotate(30deg)"><div style="margin-top:8px">Girado ✘</div></div><div style="border:1px solid var(--cor-borda-sutil);border-radius:10px;padding:12px;text-align:center"><img src="../assets/simbolo.svg" style="height:48px;filter:invert(41%) sepia(97%) saturate(4000%) hue-rotate(4deg)"><div style="margin-top:8px">Em tangelo ✘</div></div><div style="border:1px solid var(--cor-borda-sutil);border-radius:10px;padding:12px;text-align:center"><img src="../assets/simbolo.svg" style="height:48px;transform:scaleX(1.5)"><div style="margin-top:8px">Esticado ✘</div></div></div></body></html>
