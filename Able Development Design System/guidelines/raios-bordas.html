<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;width:700px;height:170px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;border:1px solid var(--cor-borda-sutil);border-radius:10px;overflow:hidden;background:var(--cor-papel)}.sw .c{height:56px}.sw .m{padding:8px 10px}.sw .n{font-size:13px;font-weight:500}.sw .x{font-size:11px;color:var(--cor-texto-secundario);font-variant-numeric:tabular-nums}.cap{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--cor-texto-secundario)}</style></head><body><div style="display:flex;gap:16px;align-items:stretch"><div style="flex:1;border:1px solid var(--cor-borda-sutil);border-radius:14px;padding:16px"><div class="cap">Card · 14 px</div><div style="font-size:15px;margin-top:8px">border 1px borda-sutil · sem sombra</div></div><div style="flex:1;display:flex;flex-direction:column;gap:10px"><button style="font:500 16px Switzer;color:var(--cor-papel);background:var(--cor-tinta);border:1px solid var(--cor-tinta);border-radius:8px;padding:10px 18px;min-height:44px">Controle · 8 px</button><input value="Input · 8 px" style="font:16px Switzer;color:var(--cor-tinta);background:var(--cor-papel);border:1px solid var(--cor-borda-controle);border-radius:8px;padding:10px 12px;min-height:44px;box-sizing:border-box"></div><div style="flex:1;border:1px solid var(--cor-borda-sutil);border-radius:16px;overflow:hidden"><div style="background:var(--cor-grafite);color:var(--cor-papel);padding:12px 16px"><div class="cap" style="color:var(--cor-grafite-texto-secundario)">Plano · 16 px</div></div><div style="padding:12px 16px;font-size:13px;color:var(--cor-texto-secundario)">header grafite</div></div></div></body></html>
